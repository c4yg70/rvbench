<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>rvbench worker</title><style>body{font:16px system-ui;background:#101827;color:#e3eaf5;max-width:1000px;margin:40px auto;padding:20px}textarea,button{font:inherit;padding:12px;border-radius:8px}textarea{box-sizing:border-box;width:100%;height:220px;background:#18243a;color:inherit}button{cursor:pointer;background:#62d4b6;border:0;margin:12px 0}pre{max-height:26rem;overflow:auto;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;background:#18243a;padding:20px;border-radius:12px}</style><h1>rvbench worker</h1><p>独立提交 · compiler · correctness / performance</p><pre id="cap">读取能力…</pre><textarea id="request">{"backend":"k3","kind":"correctness","op":"add","shape":[1024],"dtype":"float32","seed":42,"warmup":3,"repetitions":10,"timeout_secs":120}</textarea><button id="submit">提交到本 worker</button><pre id="result"></pre><p id="connection"></p><h2>最近任务</h2><pre id="jobs"></pre><script>const $=id=>document.getElementById(id);async function read(p){let r=await fetch(p);let v=await r.json();if(!r.ok)throw Error(v.error||'HTTP '+r.status);return v}let initialized=false;function summary(j){return {job_id:j.job_id,state:j.state,backend:j.request.backend,kind:j.request.kind,op:j.request.op,shape:j.request.shape,worker:j.worker_id,error:j.error}}async function refresh(){try{let c=await read('/capabilities');$('cap').textContent=JSON.stringify({worker:c.worker_id,board:c.board_id,backend:c.backend,kinds:c.kinds,delivery:c.delivery,capacity:c.capacity,ready:c.ready,ops:c.environment.ops,dtypes:c.environment.dtypes,torch:c.environment.torch,runtime:c.environment.runtime},null,2);if(!initialized){let r=JSON.parse($('request').value);r.backend=c.backend;r.kind=c.kinds.includes('correctness')?'correctness':c.kinds[0];$('request').value=JSON.stringify(r,null,2);initialized=true}$('jobs').textContent=JSON.stringify((await read('/jobs')).map(summary),null,2);$('connection').textContent='已连接 · '+new Date().toLocaleTimeString()}catch(e){$('connection').textContent='连接失败：'+e.message}}$('submit').onclick=async()=>{try{let r=await fetch('/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request:JSON.parse($('request').value)})});let j=await r.json();$('result').textContent=JSON.stringify(j,null,2);if(r.ok){while(!['done','failed','timeout','canceled'].includes(j.state)){j=await read('/jobs/'+j.job_id+'?wait=25');$('result').textContent=JSON.stringify(j,null,2)}}await refresh()}catch(e){$('result').textContent=e.message}};refresh();setInterval(refresh,5000)</script></html>
