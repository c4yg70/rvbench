name: Rust
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run -p rvbench-cli --locked -- validate spec suites/kernels/typical8/spec.json
      - run: cargo run -p rvbench-cli --locked -- validate results examples/eval_results.json --spec suites/kernels/typical8/spec.json
      - run: cargo run -p rvbench-cli --locked -- validate spec examples/baseline/spec.json
      - run: cargo run -p rvbench-cli --locked -- validate baseline-results examples/baseline/baseline-results.json --spec examples/baseline/spec.json
