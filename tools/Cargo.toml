[package]
name = "rvbench-tools"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rvbench-tools"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
chrono.workspace = true
regex.workspace = true
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"
rvbench-cli = { git = "https://github.com/rvbench/rvbench-cli.git", rev = "31a43fc516244bb216aa54579a05150186d41549" }
rvbench-protocol = { git = "https://github.com/rvbench/rvbench-core-rust.git", rev = "52356fe8220762425b5b53926d84b5f118a5a304" }
tokio.workspace = true
uuid.workspace = true
serde_json.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true
