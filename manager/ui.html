<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>rvbench manager</title><style>body{font:16px system-ui;background:#101827;color:#e3eaf5;max-width:1100px;margin:40px auto;padding:20px}textarea,button{font:inherit;padding:12px;border-radius:8px}textarea{box-sizing:border-box;width:100%;height:200px;background:#18243a;color:inherit}button{cursor:pointer;background:#62d4b6;border:0;margin:12px 0}pre{max-height:26rem;overflow:auto;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;background:#18243a;padding:20px;border-radius:12px}a{color:#62d4b6}</style><h1>rvbench manager</h1><p>统一提交 · 能力匹配 · Push / Pull · 持久租约</p><h2>节点</h2><pre id="workers"></pre><h2>提交任务</h2><textarea id="request">{"backend":"k3","kind":"correctness","op":"add","shape":[1024],"dtype":"float32","seed":42,"warmup":3,"repetitions":10,"timeout_secs":120}</textarea><button id="submit">提交并等待结果</button><pre id="result"></pre><p id="connection"></p><h2>最近任务</h2><pre id="jobs"></pre><script>const $=id=>document.getElementById(id);async function read(p){let r=await fetch(p);let v=await r.json();if(!r.ok)throw Error(v.error||'HTTP '+r.status);return v}function summary(j){return {job_id:j.job_id,state:j.state,backend:j.request.backend,kind:j.request.kind,op:j.request.op,shape:j.request.shape,worker:j.worker_id,error:j.error}}async function refresh(){try{$('workers').textContent=JSON.stringify((await read('/cluster/workers')).map(n=>({worker:n.worker.worker_id,board:n.worker.board_id,backend:n.worker.backend,kinds:n.worker.kinds,delivery:n.worker.delivery,online:n.online,ready:n.worker.ready,drained:n.drained,assigned:n.assignments.length,url:n.worker.url})),null,2);$('jobs').textContent=JSON.stringify((await read('/jobs')).map(summary),null,2);$('connection').textContent='已连接 · '+new Date().toLocaleTimeString()}catch(e){$('connection').textContent='连接失败：'+e.message}}$('submit').onclick=async()=>{try{let r=await fetch('/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(JSON.parse($('request').value))});let j=await r.json();$('result').textContent=JSON.stringify(j,null,2);if(r.ok){while(!['done','failed','timeout','canceled'].includes(j.state)){j=await read('/jobs/'+j.job_id+'?wait=25');$('result').textContent=JSON.stringify(j,null,2)}}await refresh()}catch(e){$('result').textContent=e.message}};refresh();setInterval(refresh,5000)</script></html>
